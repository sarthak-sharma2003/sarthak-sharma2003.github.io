name: Request accommodation reminder

on:
  schedule:
    # 10 a.m., 12 p.m., 3 p.m. at UTC-6 on Nov 18 -> 16:00, 18:00, 21:00 UTC
    - cron: '0 16,18,21 18 11 *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 2 --repo "$GITHUB_REPOSITORY" \
            --body "@sarthak-sharma2003 Request accommodation — reminder ($(date -u +%H:%M) UTC)"
